<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Neelendra Bandaru</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#2563eb',
                            dark: '#111827',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-brand-dark antialiased min-h-screen">
    <!-- Admin Login Container -->
    <div id="loginContainer" class="flex items-center justify-center min-h-screen p-4">
        <div class="w-full max-w-md">
            <div class="bg-white rounded-3xl shadow-xl overflow-hidden">
                <div class="p-8">
                    <div class="text-center mb-8">
                        <h1 class="text-2xl font-bold">Admin Login</h1>
                        <p class="text-gray-500 mt-2">Access your lead management dashboard</p>
                    </div>
                    <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Admin Email</label>
                            <input type="email" id="loginEmail" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-brand-blue focus:ring-2 focus:ring-blue-100 outline-none transition-all" placeholder="name@example.com">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                            <input type="password" id="loginPassword" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-brand-blue focus:ring-2 focus:ring-blue-100 outline-none transition-all">
                        </div>
                        <button type="submit" class="w-full bg-brand-dark text-white py-4 rounded-xl font-bold hover:bg-gray-800 transition-all shadow-lg shadow-gray-100">
                            Login to Dashboard
                        </button>
                    </form>
                    <div class="mt-6 text-center">
                        <a href="/" class="text-sm text-gray-400 hover:text-brand-blue transition-colors">← Back to Website</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Admin Dashboard Container (Hidden by Default) -->
    <div id="adminDashboard" class="hidden min-h-screen bg-white">
        <nav class="bg-white border-b border-gray-100 sticky top-0 z-10">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="font-bold text-xl tracking-tight">Admin Dashboard</div>
                    <button onclick="logout()" class="text-red-500 font-semibold hover:text-red-700 transition-colors">Logout</button>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <div class="mb-8">
                <h2 class="text-3xl font-bold">Incoming Leads</h2>
                <p class="text-gray-500">Manage your potential startup partners</p>
            </div>
            
            <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden overflow-x-auto">
                <table class="w-full text-left min-w-[600px]">
                    <thead class="bg-gray-50 border-b border-gray-100">
                        <tr>
                            <th class="px-6 py-4 text-sm font-semibold text-gray-600">Date</th>
                            <th class="px-6 py-4 text-sm font-semibold text-gray-600">Name</th>
                            <th class="px-6 py-4 text-sm font-semibold text-gray-600">Email</th>
                            <th class="px-6 py-4 text-sm font-semibold text-gray-600">Details</th>
                        </tr>
                    </thead>
                    <tbody id="leadsTableBody" class="divide-y divide-gray-100">
                        <!-- Leads will be injected here -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        // Auth State
        let adminToken = localStorage.getItem('adminToken');
        
        // Initial Check
        if (adminToken) {
            showDashboard();
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('adminToken', data.token);
                    adminToken = data.token;
                    showDashboard();
                } else {
                    alert('Invalid email or password.');
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('An error occurred during login.');
            }
        }

        async function showDashboard() {
            if (!adminToken) return;
            
            try {
                const response = await fetch('/api/admin/leads', {
                    headers: { 'Authorization': adminToken }
                });

                if (response.ok) {
                    const leads = await response.json();
                    const tableBody = document.getElementById('leadsTableBody');
                    tableBody.innerHTML = leads.map(lead => `
                        <tr class="hover:bg-gray-50 transition-colors">
                            <td class="px-6 py-4 text-sm text-gray-500 whitespace-nowrap">${new Date(lead.created_at).toLocaleDateString()}</td>
                            <td class="px-6 py-4 text-sm font-medium text-gray-900 whitespace-nowrap">${lead.name}</td>
                            <td class="px-6 py-4 text-sm text-gray-600 whitespace-nowrap">${lead.email}</td>
                            <td class="px-6 py-4 text-sm text-gray-500 max-w-md break-words">${lead.details}</td>
                        </tr>
                    `).join('');
                    
                    document.getElementById('loginContainer').classList.add('hidden');
                    document.getElementById('adminDashboard').classList.remove('hidden');
                    document.body.classList.remove('bg-gray-50');
                    document.body.classList.add('bg-white');
                } else {
                    localStorage.removeItem('adminToken');
                    adminToken = null;
                    document.getElementById('loginContainer').classList.remove('hidden');
                    document.getElementById('adminDashboard').classList.add('hidden');
                }
            } catch (error) {
                console.error('Dashboard error:', error);
            }
        }

        function logout() {
            localStorage.removeItem('adminToken');
            adminToken = null;
            window.location.reload();
        }
    </script>
</body>
</html>
